<title>{{book.title}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{book.description}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<!-- Shared stylesheets: build.js inlines every <link data-inline> in this order, then adds the book's colour theme. -->
<link rel="stylesheet" href="css/tokens.css" data-inline>
<link rel="stylesheet" href="css/base.css" data-inline>
<link rel="stylesheet" href="css/layout.css" data-inline>
<link rel="stylesheet" href="css/components.css" data-inline>
<link rel="stylesheet" href="css/diagrams.css" data-inline>
<link rel="stylesheet" href="css/code.css" data-inline>
<link rel="stylesheet" href="css/widgets.css" data-inline>
<link rel="stylesheet" href="css/quiz.css" data-inline>
{{book.themeStyle}}
<!-- @body (everything below goes into <body>) -->
{{svgDefs}}

<header class="topbar">
  <button class="tb-btn menu-btn" id="menuBtn" aria-label="Open chapter list" aria-expanded="false">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Chapters</button>
  <a class="tb-btn home-link" href="index.html" title="All books in the handbook">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="home-txt">All books</span></a>
  <a class="brand" href="#cover">
    <span class="brand-mark" aria-hidden="true">{{book.mark}}</span>
    <span class="brand-text">{{book.short}}<small>{{handbook.title}}</small></span></a>
  <span class="spacer"></span>
  <span class="tb-stat" id="tbStat">0 of {{count}} chapters done</span>
  <button class="tb-btn" id="themeBtn" aria-label="Switch light or dark theme">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg><span id="themeLbl">Theme</span></button>
  <div class="progress"><span id="readBar"></span></div>
</header>

<div class="shell">
  <aside class="rail" id="rail">
    <input class="rail-search" id="tocSearch" type="search" placeholder="{{book.searchHint}}" aria-label="Filter chapters">
    <div class="rail-meter"><span id="railStat">0 chapters done</span><div class="bar"><i id="railBar"></i></div></div>
    {{toc}}
  </aside>
  <main class="page" id="top">
  <div class="col">
{{chapters}}
{{otherBooks}}
  </div>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>

{{book.bootScript}}
<!-- Shared scripts: build.js inlines these in order. Book data and widgets are added after them; app.js always runs last. -->
<script src="js/core/utils.js" data-inline></script>
<script src="js/core/theme.js" data-inline></script>
<script src="js/core/navigation.js" data-inline></script>
<script src="js/core/progress.js" data-inline></script>
<script src="js/core/search.js" data-inline></script>
<script src="js/core/code-copy.js" data-inline></script>
<script src="js/features/quiz.js" data-inline></script>
<script src="js/features/interview-bank.js" data-inline></script>
{{sharedWidgets}}
{{bookScripts}}
<script src="js/app.js" data-inline></script>
